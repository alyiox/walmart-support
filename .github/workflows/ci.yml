name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Version consistency
        run: |
          pkg=$(uv version --short)
          for f in plugin.json .claude-plugin/plugin.json \
                   .cursor-plugin/plugin.json .codex-plugin/plugin.json; do
            v=$(jq -r .version "$f")
            [ "$v" = "$pkg" ] || {
              echo "::error file=$f::version $v does not match package $pkg"; exit 1; }
          done
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$pkg" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package version $pkg"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint and Format
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest tests/ -v --tb=short

  publish:
    name: Release to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/walmart-support/${{ github.ref_name }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv package manager
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Build Python package distributions
        run: uv build

      - name: Publish Python package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
